# Cargo.toml

[package]
name = "esp32multical21"
version = "1.6.5"
authors = ["Sami J. Mäkinen <sjm@iki.fi>"]
edition = "2024"


[features]
default = ["esp32-c3"]
esp32-c3 = []
esp-wroom-32 = []


[dependencies]
anyhow = "1"
askama = "0"
axum = { version = "0", features = ["http1", "json"] }
axum-macros = "0"
aes = "0"
chrono = "0"
cc1101 = { version = "0", features = ["std"] }
ctr = "0"
crc = "3"
embedded-svc = { version = "0", features = ["experimental"] }
esp-idf-sys = { version = "0", features = ["binstart"] }
esp-idf-svc = { version = "0", features = ["alloc", "experimental"] }
esp-idf-hal = "0"
log = "0"
postcard = { version = "1", features = ["alloc", "use-crc"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util"] }
thiserror = "2"

# tower-http = { version = "0", features = ["trace"] }
# tracing = "0"
# tracing-subscriber = { version = "0", features = ["env-filter"] }


[build-dependencies]
anyhow = "1"
build-data = "0"
embuild = "0"
flate2 = "1"


[profile.release]
debug = false
opt-level = "z"
codegen-units = 1
lto = "fat"
strip = true


[profile.dev]
debug = true
opt-level = 2
lto = "off"

[package.metadata.esp-idf-sys]
extra_components = [
  { remote_component = { name = "espressif/mdns", version = "*" } }
]

# EOF
